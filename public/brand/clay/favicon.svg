<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The clay ball from the nav: lit from the top left, shaded bottom right. -->
  <defs>
    <radialGradient id="clay" cx="34%" cy="30%" r="96%" fx="34%" fy="30%">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset="0.55" stop-color="#e8501f"/>
      <stop offset="1" stop-color="#b8360c"/>
    </radialGradient>
    <linearGradient id="shade" x1="0.25" y1="0.2" x2="0.9" y2="1"><stop offset="0.45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.28"/></linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#clay)"/>
  <circle cx="32" cy="32" r="30" fill="url(#shade)"/>
  <ellipse cx="22" cy="19" rx="8" ry="5" fill="#fff" opacity="0.32" transform="rotate(-32 22 19)"/>
</svg>
