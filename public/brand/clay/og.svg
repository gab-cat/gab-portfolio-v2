<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social card: the hero's world in one frame. Rendered with the site's
       own fonts by scripts/rasterize-brand.ts. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf1e5"/>
      <stop offset="0.7" stop-color="#f5d6bd"/>
    </linearGradient>
    <radialGradient id="clay" cx="34%" cy="30%" r="96%" fx="34%" fy="30%">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset="0.55" stop-color="#e8501f"/>
      <stop offset="1" stop-color="#b8360c"/>
    </radialGradient>
    <linearGradient id="shade" x1="0.25" y1="0.2" x2="0.9" y2="1"><stop offset="0.45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.28"/></linearGradient>
    <radialGradient id="butter" cx="34%" cy="30%" r="96%"><stop offset="0" stop-color="#fff0b8"/><stop offset="0.6" stop-color="#f6cf5f"/><stop offset="1" stop-color="#c99a26"/></radialGradient>
    <radialGradient id="sky-ball" cx="34%" cy="30%" r="96%"><stop offset="0" stop-color="#e3f0fb"/><stop offset="0.6" stop-color="#86b6e0"/><stop offset="1" stop-color="#4f7fc0"/></radialGradient>
    <radialGradient id="lilac" cx="34%" cy="30%" r="96%"><stop offset="0" stop-color="#efe8ff"/><stop offset="0.6" stop-color="#b9a4ec"/><stop offset="1" stop-color="#7f66c4"/></radialGradient>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f4a24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f4a24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="1100" cy="110" r="62" fill="#f6cf5f" opacity="0.85"/>
  <ellipse cx="300" cy="560" rx="560" ry="150" fill="#7fa36e"/>
  <ellipse cx="1000" cy="545" rx="520" ry="170" fill="#5f8c5c"/>
  <rect x="0" y="560" width="1200" height="70" fill="#8fb66e"/>
  <ellipse cx="640" cy="620" rx="760" ry="90" fill="#9ec27f"/>
  <ellipse cx="880" cy="512" rx="150" ry="22" fill="url(#floor)"/>
  <circle cx="880" cy="340" r="165" fill="url(#clay)"/>
  <circle cx="880" cy="340" r="165" fill="url(#shade)"/>
  <ellipse cx="826" cy="272" rx="44" ry="26" fill="#fff" opacity="0.3" transform="rotate(-32 826 272)"/>
  <circle cx="1090" cy="470" r="42" fill="url(#butter)"/>
  <circle cx="700" cy="505" r="30" fill="url(#sky-ball)"/>
