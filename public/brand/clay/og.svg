  <text x="116" y="102" fill="#1f1b17" font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">gabcat.dev</text>
  <text x="66" y="250" fill="#1f1b17" font-family="Power Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="100" font-weight="700" letter-spacing="-5">Gabriel</text>
  <text x="66" y="350" fill="#1f1b17" font-family="Power Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="100" font-weight="700" letter-spacing="-5">Catimbang</text>
