<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>gabcat.dev — spine + bleed merge</title>
<style>
  @font-face {
    font-family: "Power Grotesk";
    src: url("/public/fonts/PowerGroteskTrial-Bold.woff2") format("woff2");
    font-weight: 700;
  }
  @font-face {
    font-family: "Instrument Serif";
    src: url("/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2") format("woff2");
    font-weight: 400;
    font-style: italic;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1612; }
  .card {
    width: 1050px;
    height: 600px;
    position: relative;
    overflow: hidden;
    margin-bottom: 48px;
    display: grid;
  }

  /* ========== M1 — dark bleed + left orange spine ========== */
  .m1 {
    background: #17130d;
    color: #faf6ef;
    grid-template-columns: 100px 1fr;
  }
  .m1 .spine {
    background: #e84300;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }
  .m1 .spine-text {
    font-family: "Power Grotesk", sans-serif;
    font-weight: 700;
    font-size: 36px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #faf6ef;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    white-space: nowrap;
  }
  .m1 .stage {
    position: relative;
    overflow: hidden;
  }
  .m1 .bleed {
    position: absolute;
    left: -36px;
    right: -90px;
    top: 44%;
    transform: translateY(-50%);
    font-family: "Power Grotesk", sans-serif;
    font-weight: 700;
    font-size: 152px;
    line-height: 0.78;
    letter-spacing: -0.055em;
    text-transform: uppercase;
    color: #e84300;
    pointer-events: none;
    z-index: 1;
  }
  .m1 .bleed .line2 { color: #faf6ef; }
  .m1 .overlay {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 40px 40px 40px 36px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .m1 .top {
    display: flex;
    justify-content: flex-end;
  }
  .m1 .role {
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-size: 24px;
  }
  .m1 .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .m1 .email {
    font-family: "JetBrains Mono", monospace;
    font-size: 15px;
    color: #a49b8a;
  }
  .m1 .qr-box {
    width: 128px;
    height: 128px;
    background: #e84300;
    padding: 10px;
  }
  .m1 .qr-box img { width: 100%; height: 100%; display: block; }

  /* ========== M2 — cream + spine + orange bleed ========== */
  .m2 {
    background: #faf6ef;
    color: #17130d;
    grid-template-columns: 100px 1fr;
  }
  .m2 .spine {
    background: #e84300;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }
  .m2 .spine-text {
    font-family: "Power Grotesk", sans-serif;
    font-weight: 700;
    font-size: 36px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #faf6ef;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    white-space: nowrap;
  }
  .m2 .stage { position: relative; overflow: hidden; }
  .m2 .bleed {
    position: absolute;
    left: -40px;
    right: -100px;
    top: 48%;
    transform: translateY(-50%);
    font-family: "Power Grotesk", sans-serif;
    font-weight: 700;
    font-size: 148px;
    line-height: 0.78;
    letter-spacing: -0.055em;
    text-transform: uppercase;
    color: #e84300;
    pointer-events: none;
    z-index: 1;
    opacity: 0.9;
  }
  .m2 .bleed .line2 {
    color: #17130d;
    opacity: 0.14;
  }
  .m2 .overlay {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 40px 40px 40px 36px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .m2 .top { display: flex; justify-content: flex-end; }
  .m2 .role {
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-size: 24px;
    color: #e84300;
  }
  .m2 .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .m2 .email {
    font-family: "JetBrains Mono", monospace;
    font-size: 15px;
    color: #6e6759;
  }
  .m2 .qr-box {
    width: 128px;
    height: 128px;
    border: 2px solid #17130d;
    padding: 10px;
    background: #fffdf8;
  }
  .m2 .qr-box img { width: 100%; height: 100%; display: block; }

  /* ========== M3 — spine + bleed, QR in spine bottom ========== */
  .m3 {
    background: #17130d;
    color: #faf6ef;
    grid-template-columns: 180px 1fr;
  }
  .m3 .spine {
    background: #e84300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 36px 22px;
    z-index: 3;
  }
  .m3 .spine-text {
    font-family: "Power Grotesk", sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #faf6ef;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    white-space: nowrap;
  }
  .m3 .qr-box {
    width: 120px;
    height: 120px;
    background: #faf6ef;
    padding: 10px;
    flex-shrink: 0;
  }
  .m3 .qr-box img { width: 100%; height: 100%; display: block; }
  .m3 .stage { position: relative; overflow: hidden; }
  .m3 .bleed {
    position: absolute;
    left: -48px;
    right: -80px;
    top: 42%;
    transform: translateY(-50%);
    font-family: "Power Grotesk", sans-serif;
    font-weight: 700;
    font-size: 148px;
    line-height: 0.78;
    letter-spacing: -0.055em;
    text-transform: uppercase;
    color: #e84300;
    pointer-events: none;
    z-index: 1;
  }
  .m3 .bleed .line2 { color: #faf6ef; }
  .m3 .overlay {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 40px 44px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .m3 .role {
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-size: 26px;
    align-self: flex-end;
  }
  .m3 .email {
    font-family: "JetBrains Mono", monospace;
    font-size: 16px;
    color: #a49b8a;
  }
</style>
</head>
<body>

  <!-- M1: closest to originals merged -->
  <div class="card m1" id="m1">
    <div class="spine"><div class="spine-text">gabcat.dev</div></div>
    <div class="stage">
      <div class="bleed">
        <div>Gabriel</div>
        <div class="line2">Catimbang</div>
      </div>
      <div class="overlay">
        <div class="top"><div class="role">Developer &amp; DevOps</div></div>
        <div class="bottom">
          <div class="email">catimbanggabriel@gmail.com</div>
          <div class="qr-box"><img src="./qr-on-flame.png" alt="" /></div>
        </div>
      </div>
    </div>
  </div>

  <!-- M2: cream version of the merge -->
  <div class="card m2" id="m2">
    <div class="spine"><div class="spine-text">gabcat.dev</div></div>
    <div class="stage">
      <div class="bleed">
        <div>Gabriel</div>
        <div class="line2">Catimbang</div>
      </div>
      <div class="overlay">
        <div class="top"><div class="role">Developer &amp; DevOps</div></div>
        <div class="bottom">
          <div class="email">catimbanggabriel@gmail.com</div>
          <div class="qr-box"><img src="./qr.png" alt="" /></div>
        </div>
      </div>
    </div>
  </div>

  <!-- M3: QR tucked into the spine -->
  <div class="card m3" id="m3">
    <div class="spine">
      <div class="spine-text">gabcat.dev</div>
      <div class="qr-box"><img src="./qr.png" alt="" /></div>
    </div>
    <div class="stage">
      <div class="bleed">
        <div>Gabriel</div>
        <div class="line2">Catimbang</div>
      </div>
      <div class="overlay">
        <div class="role">Developer &amp; DevOps</div>
        <div class="email">catimbanggabriel@gmail.com</div>
      </div>
    </div>
  </div>

</body>
</html>
