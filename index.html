<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <script>
      (function () {
        var stored =
          new URLSearchParams(location.search).get("mode") ||
          localStorage.getItem("theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <!-- Prerendered content ships with initial animation styles (opacity: 0);
         without JS those animations never run, so force everything visible. -->
    <noscript>
      <style>
        [style] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
